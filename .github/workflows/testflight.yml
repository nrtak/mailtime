name: TestFlight
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[testflight] '))
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify SDK and run native tests
        shell: bash
        run: |
          set -euo pipefail
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          [[ "${sdk%%.*}" == 27 ]]
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, rows in sorted(devices.items(), reverse=True)
                    if runtime.split(".")[-1].startswith("iOS-27-")
                    for d in rows if d.get("isAvailable") and d["name"].startswith("iPhone")]
          if not phones: sys.exit("The runner needs an available iOS 27 iPhone simulator.")
          print(next((d for d in phones if d["name"] == "iPhone 16"), phones[0])["udid"])')
          xcodebuild test -project EmailClient.xcodeproj -scheme EmailClient \
            -destination "platform=iOS Simulator,id=$device" CODE_SIGNING_ALLOWED=NO
      - name: Sign and upload to App Store Connect
        shell: bash
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'R3233N87DC' }}
          KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${TEAM_ID:?Missing Apple team ID}"
          : "${KEY_ID:?Missing API key ID}" "${ISSUER_ID:?Missing issuer}" "${ASC_PRIVATE_KEY:?Missing signing API key}"
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/asc.XXXXXX")
          keychain="$signing_dir/kira.keychain-db"
          profile_copy=""
          original_keychains=()
          cleanup() {
            if [[ -f "$keychain" ]]; then
              if (( ${#original_keychains[@]} )); then
                security list-keychains -d user -s "${original_keychains[@]}" || true
              fi
              security delete-keychain "$keychain" || true
            fi
            if [[ -n "$profile_copy" ]]; then rm -f "$profile_copy"; fi
            rm -rf "$signing_dir"
          }
          trap cleanup EXIT
          key="$signing_dir/AuthKey.p8"
          python3 - "$key" <<'PY'
          import base64
          import binascii
          import os
          import sys
          from pathlib import Path

          value = os.environ["ASC_PRIVATE_KEY"].strip().lstrip("\ufeff").strip()
          if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
              value = value[1:-1].strip()
          value = value.replace("\\r\\n", "\n").replace("\\n", "\n").strip()
          begin, end = "-----BEGIN PRIVATE KEY-----", "-----END PRIVATE KEY-----"
          if value.lower().endswith(".p8"):
              sys.exit("The private-key secret contains a filename. Save the text inside the Apple .p8 file as its value.")
          if not value.startswith(begin):
              try:
                  decoded = base64.b64decode("".join(value.split()), validate=True).decode("ascii").strip()
                  if decoded.startswith(begin):
                      value = decoded
              except (ValueError, binascii.Error):
                  pass
          if not (value.startswith(begin) and value.endswith(end)):
              sys.exit("The private-key secret is missing its Apple PEM header or footer. Copy both boundary lines and all the text between them.")
          payload = "".join(value[len(begin):-len(end)].split())
          if not payload:
              sys.exit("The private-key secret has an empty key body.")
          try:
              base64.b64decode(payload, validate=True)
          except (ValueError, binascii.Error):
              sys.exit("The private-key secret contains an incomplete or invalid base64 key body.")
          lines = [payload[i:i + 64] for i in range(0, len(payload), 64)]
          Path(sys.argv[1]).write_text("\n".join([begin, *lines, end, ""]), encoding="ascii")
          PY
          unset ASC_PRIVATE_KEY
          if ! openssl pkey -in "$key" -pubout -out /dev/null </dev/null >/dev/null 2>&1; then
            echo "::error::The private-key secret does not contain a usable Apple private key. Recopy the complete .p8 contents."
            exit 1
          fi
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
                -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          archive_signing=(CODE_SIGNING_ALLOWED=NO)
          export PROFILE_UUID=""
          if [[ -n "$IOS_DISTRIBUTION_P12_BASE64$IOS_DISTRIBUTION_P12_PASSWORD$IOS_PROFILE_BASE64" ]]; then
            : "${IOS_DISTRIBUTION_P12_BASE64:?Missing distribution certificate}" "${IOS_PROFILE_BASE64:?Missing Kira Mail distribution profile}"
            printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$signing_dir/profile.mobileprovision"
            printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$signing_dir/distribution.p12"
            unset IOS_DISTRIBUTION_P12_BASE64 IOS_PROFILE_BASE64
            security cms -D -i "$signing_dir/profile.mobileprovision" > "$signing_dir/profile.plist"
            PROFILE_UUID=$(python3 - "$signing_dir/profile.plist" <<'PY'
          import datetime, os, plistlib, sys, uuid
          with open(sys.argv[1], "rb") as source:
              profile = plistlib.load(source)
          entitlements = profile["Entitlements"]
          if os.environ["TEAM_ID"] not in profile["TeamIdentifier"] or not any(
              entitlements.get("application-identifier") == prefix + ".com.zenmail.emailclient"
              for prefix in profile["ApplicationIdentifierPrefix"]
          ):
              sys.exit("The profile must belong to this team and the Kira Mail bundle ID.")
          if entitlements.get("get-task-allow") or "ProvisionedDevices" in profile or profile.get("ProvisionsAllDevices"):
              sys.exit("Kira Mail requires an App Store Connect distribution profile.")
          if profile["ExpirationDate"] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
              sys.exit("The Kira Mail distribution profile has expired.")
          uuid.UUID(profile["UUID"])
          print(profile["UUID"])
          PY
            )
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$signing_dir/profile.plist")
            export PROFILE_NAME
            profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            mkdir -p "$profiles"
            if [[ ! -f "$profiles/$PROFILE_UUID.mobileprovision" ]]; then
              profile_copy="$profiles/$PROFILE_UUID.mobileprovision"
              cp "$signing_dir/profile.mobileprovision" "$profile_copy"
            fi
            while IFS= read -r item; do
              original_keychains+=("$item")
            done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"$//')
            keychain_password=$(uuidgen)
            security create-keychain -p "$keychain_password" "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security list-keychains -d user -s "$keychain" "${original_keychains[@]}"
            security import "$signing_dir/distribution.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -k "$keychain" >/dev/null
            unset IOS_DISTRIBUTION_P12_PASSWORD
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
            security find-identity -v -p codesigning "$keychain" > "$signing_dir/identities.txt"
            SIGNING_CERTIFICATE=$(python3 - "$signing_dir/profile.plist" "$signing_dir/identities.txt" <<'PY'
          import hashlib, plistlib, re, sys
          from pathlib import Path

          profile = plistlib.loads(Path(sys.argv[1]).read_bytes())
          identities = Path(sys.argv[2]).read_text()
          available = set(re.findall(r'^\s*\d+\) ([A-Fa-f0-9]{40}) "', identities, re.MULTILINE))
          fingerprints = {fingerprint.upper() for fingerprint in available}
          for certificate in profile.get("DeveloperCertificates", []):
              fingerprint = hashlib.sha1(certificate).hexdigest().upper()
              if fingerprint in fingerprints:
                  print(fingerprint)
                  break
          else:
              sys.exit("The installed signing identity must match a distribution certificate in the Kira Mail profile.")
          PY
            )
            export SIGNING_CERTIFICATE
            archive_signing=(CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=$SIGNING_CERTIFICATE" "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME")
          fi
          archive="$RUNNER_TEMP/EmailClient.xcarchive"
          xcodebuild archive -project EmailClient.xcodeproj -scheme EmailClient -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" "${archive_signing[@]}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          options="$signing_dir/export.plist"
          python3 - "$options" <<'PY'
          import os, plistlib, sys
          with open(sys.argv[1], "wb") as out:
              options = {"method": "app-store-connect", "destination": "upload",
                         "teamID": os.environ["TEAM_ID"], "signingStyle": "automatic",
                         "manageAppVersionAndBuildNumber": False}
              if os.environ["PROFILE_UUID"]:
                  options.update(signingStyle="manual", signingCertificate=os.environ["SIGNING_CERTIFICATE"],
                                 provisioningProfiles={"com.zenmail.emailclient": os.environ["PROFILE_NAME"]})
              plistlib.dump(options, out)
          PY
          xcodebuild -exportArchive -archivePath "$archive" -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
